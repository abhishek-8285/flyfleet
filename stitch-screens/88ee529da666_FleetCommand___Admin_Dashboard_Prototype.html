                            <span className="text-sm font-medium">Fleet</span>

                                            </div>
                                        </div>

                                                </div>
                                            </div>
                                        </div>

                                    </div>

                                    <select className="appearance-none bg-surface-dark border border-border-color text-white text-xs rounded pl-3 pr-8 py-1.5 focus:ring-1 focus:ring-primary focus:border-primary cursor-pointer hover:bg-border-color transition-colors">

                                </div>
                            </div>
                            <div className="flex items-center gap-3 ml-auto">
                                <div className="flex items-center gap-2 text-xs text-text-muted bg-border-color/30 px-2 py-1 rounded border border-border-color/50">

                                        { title: "Active Trips", value: "125", icon: "route", color: "text-purple-500", bg: "bg-purple-500/10", trend: "2%", trendColor: "text-emerald-500" },

                                                    <div className="flex items-center gap-1 mb-1 cursor-help">
                                                        <p className="text-text-muted text-sm font-medium">{kpi.title}</p>
                                                        <span className="material-symbols-outlined text-[14px] text-text-muted/50 hover:text-primary">info</span>
                                                    </div>
                                                    <h3 className="text-3xl font-bold text-white tracking-tight">{kpi.value}</h3>
                                                </div>
                                                <div className={`p-2 ${kpi.bg} rounded-lg ${kpi.color}`}>
