<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - {{PRODUCT_NAME}}</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display flex flex-col items-center justify-center p-4">
<div class="w-full max-w-[480px] flex flex-col items-center">
<div class="mb-8 flex justify-center">
<div class="h-16 w-16 bg-primary/10 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl">local_shipping</span>
</div>
</div>
<div class="w-full bg-white dark:bg-gray-900 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 dark:border-gray-800 overflow-hidden">
<div class="p-8 sm:p-10">
<div class="text-center mb-8">
<h2 class="text-slate-900 dark:text-white tracking-tight text-2xl font-bold leading-tight mb-2">
                    Sign in to {{PRODUCT_NAME}}
                </h2>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal">
                    Enter your credentials to access the fleet dashboard.
                </p>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="flex flex-col gap-1">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium leading-normal" for="email">Email Address</label>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-red-500/20 border border-red-500 dark:border-red-500 bg-slate-50 dark:bg-gray-800 focus:border-red-500 h-12 placeholder:text-slate-400 px-4 text-base font-normal leading-normal transition-all duration-200 ease-in-out" id="email" name="email" placeholder="name@company.com" required="" type="email" value="alex.morris@"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-red-500" style="font-size: 20px;">error</span>
</div>
</div>
<p class="text-red-600 text-sm font-medium mt-0.5 animate-pulse">Invalid email format</p>
</div>
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium leading-normal" for="password">Password</label>
<a class="text-sm font-medium text-primary hover:text-blue-600 transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex w-full items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg rounded-r-none text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-red-500/20 border border-red-500 dark:border-red-500 bg-slate-50 dark:bg-gray-800 focus:border-red-500 h-12 placeholder:text-slate-400 px-4 border-r-0 text-base font-normal leading-normal transition-all duration-200 ease-in-out" id="password" name="password" placeholder="Enter your password" required="" type="password" value="password123"/>
<button class="flex items-center justify-center px-4 rounded-r-lg border border-l-0 border-red-500 dark:border-red-500 bg-slate-50 dark:bg-gray-800 hover:bg-slate-100 dark:hover:bg-gray-700 transition-colors group" type="button">
<span class="material-symbols-outlined text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300" style="font-size: 20px;">visibility</span>
</button>
</div>
<p class="text-red-600 text-sm font-medium mt-0.5">Incorrect password</p>
</div>
<div class="pt-2">
<button class="flex w-full cursor-not-allowed items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary/90 text-white text-base font-bold leading-normal tracking-[0.015em] transition-all duration-200 shadow-sm" disabled="" type="button">
<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span class="truncate">Sign In</span>
</button>
</div>
<div class="space-y-4">
<div class="relative flex items-center justify-center">
<div class="flex-grow border-t border-slate-200 dark:border-gray-700"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium uppercase tracking-wider">OR</span>
<div class="flex-grow border-t border-slate-200 dark:border-gray-700"></div>
</div>
<div class="flex flex-col gap-3">
<button class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 h-12 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-gray-750 focus:outline-none focus:ring-2 focus:ring-slate-200 transition-all shadow-sm" type="button">
<svg class="h-5 w-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Sign in with Google</span>
</button>
<button class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 h-12 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-gray-750 focus:outline-none focus:ring-2 focus:ring-slate-200 transition-all shadow-sm" type="button">
<svg class="h-5 w-5" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
<rect fill="#F25022" height="9" width="9" x="1" y="1"></rect>
<rect fill="#7FBA00" height="9" width="9" x="11" y="1"></rect>
<rect fill="#00A4EF" height="9" width="9" x="1" y="11"></rect>
<rect fill="#FFB900" height="9" width="9" x="11" y="11"></rect>
</svg>
<span>Sign in with Microsoft</span>
</button>
<button class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 h-12 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-gray-750 focus:outline-none focus:ring-2 focus:ring-slate-200 transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-slate-500" style="font-size: 20px;">vpn_key</span>
<span>Sign in with SSO</span>
</button>
</div>
</div>
</form>
</div>
<div class="bg-slate-50 dark:bg-gray-800/50 px-8 py-4 border-t border-slate-100 dark:border-gray-800 text-center">
<p class="text-xs text-slate-500 dark:text-slate-400">
                Need help? <a class="text-primary hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
<div class="mt-8 text-center">
<p class="text-slate-400 text-xs">
            © 2024 {{COMPANY_NAME}}. All rights reserved.
        </p>
<div class="mt-2 flex gap-4 justify-center text-xs text-slate-400">
<a class="hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">Privacy Policy</a>
<span>·</span>
<a class="hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>

</body></html>
