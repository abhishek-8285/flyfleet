version: '3.8'

services:
  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flyfleet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: billing_db
    ports:
      - "5433:5432"

  billing-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  billing-nats:
    image: nats:2.10-alpine
    ports:
      - "4223:4222"

  billing-service:
    build: .
    depends_on:
      - billing-db
      - billing-redis
      - billing-nats
    environment:
      - DB_HOST=billing-db
      - DB_USER=flyfleet
      - DB_PASS=password
      - DB_NAME=billing_db
      - REDIS_URL=billing-redis:6379
      - NATS_URL=nats://billing-nats:4222
      - JWT_SECRET=your-secret-here
    ports:
      - "8081:8081"

