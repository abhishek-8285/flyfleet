openapi: 3.0.3
info:
  title: Reports Service API
  description: Management and execution API for scheduled reports.
  version: 1.0.0
servers:
  - url: /api/v1/admin/reports
    description: Proxied through Web BFF

paths:
  /schedules:
    get:
      summary: List scheduled reports
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of scheduled reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduledReport'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      summary: Create a new scheduled report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid

  /schedules/{id}:
    get:
      summary: Get report details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledReport'
    put:
      summary: Update scheduled report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportRequest'
      responses:
        '200':
          description: Updated

  /schedules/{id}/pause:
    post:
      summary: Pause a scheduled report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paused

  /schedules/{id}/resume:
    post:
      summary: Resume a scheduled report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumed

  /executions:
    get:
      summary: List execution history
      parameters:
        - name: report_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportExecution'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /settings:
    get:
      summary: Get global settings
      responses:
        '200':
          description: Global settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
    put:
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSettings'
      responses:
        '200':
          description: Updated

components:
  schemas:
    ScheduledReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        report_type:
          type: string
        format:
          type: string
          enum: [PDF, CSV, XLSX]
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        cron_expression:
          type: string
        delivery_time:
          type: string
        timezone:
          type: string
        filters:
          type: object
        recipients:
          type: array
          items:
            type: string
            format: email
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        next_run:
          type: string
          format: date-time

    CreateReportRequest:
      type: object
      required: [name, report_type, format, frequency, cron_expression, recipients]
      properties:
        name:
          type: string
        report_type:
          type: string
        format:
          type: string
          enum: [PDF, CSV, XLSX]
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        cron_expression:
          type: string
        delivery_time:
          type: string
        timezone:
          type: string
        filters:
          type: object
        recipients:
          type: array
          items:
            type: string
            format: email

    UpdateReportRequest:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
        frequency:
          type: string
        cron_expression:
          type: string
        filters:
          type: object
        recipients:
          type: array
          items:
            type: string
            format: email

    ReportExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        report_name:
          type: string
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        status:
          type: string
          enum: [SUCCESS, FAILED]
        file_url:
          type: string
        error_message:
          type: string

    GlobalSettings:
      type: object
      properties:
        max_concurrent_jobs:
          type: integer
        max_retry_attempts:
          type: integer
        retention_days:
          type: integer
        smtp_host:
          type: string
        smtp_port:
          type: integer
        smtp_user:
          type: string
