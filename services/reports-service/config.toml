[server]
port = 8083
host = "0.0.0.0"
read_timeout = "30s"
write_timeout = "30s"

[database]
host = "postgres"
port = 5432
user = "fleet_user"
password = ""
dbname = "fleet_db"
sslmode = "disable"
max_open_conns = 100
max_idle_conns = 10
conn_max_lifetime = "1h"

[redis]
host = "redis"
port = 6379
password = ""
db = 0
pool_size = 20
min_idle_conns = 5
pool_timeout = "30s"

[security]
jwt_secret = ""
token_expiry = "24h"

[logging]
level = "info"
format = "json"
output = "stdout"
