openapi: 3.0.3
info:
  title: FlyFleet Trip Management API
  description: API for managing trips, telemetry, and trip settings
  version: 1.0.0
  contact:
    name: FlyFleet Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development Server
  - url: https://api.flyfleet.io/api/v1
    description: Production Server

tags:
  - name: Trips
    description: Trip management operations
  - name: Telemetry
    description: Real-time vehicle telemetry
  - name: Settings
    description: Organization trip settings

paths:
  /trips:
    get:
      tags: [Trips]
      summary: List all trips
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TripStatus'
        - name: vehicle_id
          in: query
          schema:
            type: string
            format: uuid
        - name: driver_id
          in: query
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Trips]
      summary: Create a new trip
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{id}:
    parameters:
      - $ref: '#/components/parameters/TripIdParam'

    get:
      tags: [Trips]
      summary: Get trip by ID
      operationId: getTrip
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Trips]
      summary: Update trip
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Trip updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Trips]
      summary: Delete trip
      operationId: deleteTrip
      responses:
        '204':
          description: Trip deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{id}/telemetry:
    parameters:
      - $ref: '#/components/parameters/TripIdParam'

    get:
      tags: [Telemetry]
      summary: Get trip telemetry events
      operationId: getTripTelemetry
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Telemetry events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/settings:
    get:
      tags: [Settings]
      summary: Get organization trip settings
      operationId: getTripSettings
      responses:
        '200':
          description: Trip settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSettings'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Settings]
      summary: Update organization trip settings
      operationId: updateTripSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripSettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TripIdParam:
      name: id
      in: path
      required: true
      description: Trip ID (UUID or trip_id string)
      schema:
        type: string

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    TripStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]

    Trip:
      type: object
      required:
        - id
        - trip_id
        - vehicle_id
        - start_location
        - end_location
        - start_time
        - status
        - organization_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          pattern: '^TR-\d{4}-\d{4}$'
          example: TR-2026-0001
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
          nullable: true
        start_location:
          type: string
          minLength: 1
          maxLength: 255
        end_location:
          type: string
          minLength: 1
          maxLength: 255
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        distance:
          type: number
          format: float
          minimum: 0
        status:
          $ref: '#/components/schemas/TripStatus'
        organization_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      required:
        - vehicle_id
        - start_location
        - end_location
        - start_time
      properties:
        vehicle_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
          nullable: true
        start_location:
          type: string
          minLength: 1
          maxLength: 255
        end_location:
          type: string
          minLength: 1
          maxLength: 255
        start_time:
          type: string
          format: date-time

    UpdateTripRequest:
      type: object
      properties:
        driver_id:
          type: string
          format: uuid
          nullable: true
        start_location:
          type: string
          minLength: 1
          maxLength: 255
        end_location:
          type: string
          minLength: 1
          maxLength: 255
        distance:
          type: number
          format: float
          minimum: 0
        status:
          $ref: '#/components/schemas/TripStatus'
        end_time:
          type: string
          format: date-time

    TripListResponse:
      type: object
      required:
        - trips
        - total
        - page
        - limit
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1

    Telemetry:
      type: object
      required:
        - id
        - trip_id
        - latitude
        - longitude
        - event_time
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        speed:
          type: number
          format: float
          minimum: 0
        heading:
          type: number
          format: float
          minimum: 0
          maximum: 360
        event_type:
          type: string
          maxLength: 50
        event_time:
          type: string
          format: date-time

    TelemetryResponse:
      type: object
      required:
        - events
        - count
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Telemetry'
        count:
          type: integer
          minimum: 0

    TripSettings:
      type: object
      required:
        - organization_id
        - retention_period
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        retention_period:
          type: integer
          minimum: 1
          maximum: 120
          description: Data retention in months
        policies:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          type: string
        code:
          type: string

    ValidationError:
      type: object
      required:
        - error
        - validation_errors
      properties:
        error:
          type: string
        validation_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
