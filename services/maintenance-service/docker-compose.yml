version: '3.8'

services:
  maintenance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flyfleet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maintenance_db
    ports:
      - "5432:5432"

  maintenance-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  maintenance-nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  maintenance-service:
    build: .
    depends_on:
      - maintenance-db
      - maintenance-redis
      - maintenance-nats
    environment:
      - DB_HOST=maintenance-db
      - DB_USER=flyfleet
      - DB_PASS=password
      - DB_NAME=maintenance_db
      - REDIS_URL=maintenance-redis:6379
      - NATS_URL=nats://maintenance-nats:4222
      - JWT_SECRET=your-secret-here
    ports:
      - "8080:8080"
