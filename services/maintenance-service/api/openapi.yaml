openapi: 3.1.0
info:
  title: FlyFleet Maintenance Service
  description: Microservice for managing vehicle maintenance schedules, work orders, and parts inventory.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/maintenance/schedules:
    get:
      summary: List maintenance schedules
      description: Returns a paginated list of maintenance schedules for the authenticated organization.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of maintenance schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSchedules'
    post:
      summary: Create a maintenance schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceSchedule'

  /api/v1/maintenance/schedules/{id}:
    get:
      summary: Get a maintenance schedule by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

    put:
      summary: Update a maintenance schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Updated

    delete:
      summary: Soft delete a maintenance schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content

  /api/v1/maintenance/schedules/{id}/complete:
    post:
      summary: Mark a maintenance schedule as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteScheduleRequest'
      responses:
        '200':
          description: Completed

components:
  schemas:
    MaintenanceSchedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        type: { type: string, enum: [preventive, corrective, inspection] }
        name: { type: string }
        status: { type: string, enum: [scheduled, in_progress, completed, overdue] }
        priority: { type: string, enum: [low, medium, high, critical] }

    PaginatedSchedules:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceSchedule'
        meta:
          type: object

    CreateScheduleRequest:
      type: object
      required: [vehicle_id, type, name, due_date, priority]
      properties:
        vehicle_id: { type: string, format: uuid }
        type: { type: string, enum: [preventive, corrective, inspection] }
        name: { type: string }
        due_date: { type: string, format: date-time }
        priority: { type: string, enum: [low, medium, high, critical] }

    UpdateScheduleRequest:
      type: object
      properties:
        type: { type: string, enum: [preventive, corrective, inspection] }
        name: { type: string }

    CompleteScheduleRequest:
      type: object
      required: [actual_cost]
      properties:
        actual_cost: { type: number }
        notes: { type: string }

