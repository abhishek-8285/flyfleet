[server]
port = 8081
host = "0.0.0.0"
read_timeout = "30s"
write_timeout = "30s"

[database]
host = "postgres"
port = 5432
user = "fleet_user"
password = "fleet_password"
dbname = "fleet_db"
sslmode = "disable"
max_open_conns = 100
max_idle_conns = 10
conn_max_lifetime = "1h"

[auth]
service_url = "http://auth-service:8080"

[fleet_core]
service_url = "http://fleet-core-service:8084"

[alert]
service_url = "http://alert-service:8085"

[billing]
service_url = "http://billing-service:8087"

[admin_support]
service_url = "http://admin-support-service:8086"

[tracking]
service_url = "http://tracking-service:8082"

[security]
jwt_secret = "your-jwt-secret-key-here"
token_expiry = "24h"

[logging]
level = "info"
format = "json"
output = "stdout"
