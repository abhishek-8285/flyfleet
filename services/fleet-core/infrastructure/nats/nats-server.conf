# FlyFleet NATS JetStream Configuration
# Optimized for 100,000 Vehicles @ 1Hz (~100k msgs/sec ingest)

# Client Connection Tuning
# Default is 64k. 100k vehicles + backend services require massive headroom.
max_connections: 150000

# Connection Timeout
# Default is 2s. Indian 4G highways have high latency. 
# Aggressive production value is 10s to prevent constant TLS handshake retries.
ping_interval: 2m
ping_max: 5
auth_timeout: 10s

jetstream {
  # Storage Directory
  store_dir: "/data/nats/jetstream"
  
  # Maximum Memory (max_mem)
  # Default is 75% of system RAM.
  # We restrict to exactly 8GB (Aggressive Limit) because we offload to disk 
  # immediately. Memory exhaustion causes JetStream RAFT clusters to crash synchronously.
  max_mem: 8G

  # Maximum File Storage (max_file)
  # Default is 1TB.
  # We set this to 500GB explicitly matched to the attached NVMe EBS volume 
  # to prevent the OS from attempting over-allocation, resulting in Disk I/O stalling.
  max_file: 500G
}

# Leaf Nodes Integration (For edge data centers in remote locations)
# When a remote warehouse loses internet, the LeafNode queues locally.
leafnodes {
  # Accept leafNode connections on this port
  port: 7422
  
  # Reconnect logic for when edge locations drop offline
  reconnect_action: "warn"
  
  # Require secure connections from edge nodes
  tls {
    cert_file: "/etc/nats/certs/leaf_server.pem"
    key_file: "/etc/nats/certs/leaf_server-key.pem"
    ca_file:   "/etc/nats/certs/ca.pem"
    verify_and_map: true
  }
}

# Prometheus System Metrics
monitor_port: 8222
