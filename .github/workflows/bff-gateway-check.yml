name: BFF Gateway Contract Check

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'apps/dashboard-web/**'
      - 'services/microservices/web-bff/**'
      - 'scripts/check_bff_contract.py'
      - 'scripts/check_frontend_api_hygiene.py'
      - 'Makefile'
      - '.github/workflows/bff-gateway-check.yml'
  push:
    branches: [master, main, develop]
    paths:
      - 'apps/dashboard-web/**'
      - 'services/microservices/web-bff/**'
      - 'scripts/check_bff_contract.py'
      - 'scripts/check_frontend_api_hygiene.py'
      - 'Makefile'
      - '.github/workflows/bff-gateway-check.yml'

jobs:
  contract-check:
    name: Frontend/BFF Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contract check
        run: make bff-contract-check

      - name: Run frontend API hygiene check
        run: make frontend-api-check

  bff-build:
    name: Build web-bff
    runs-on: ubuntu-latest
    needs: contract-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build web-bff
        run: make bff-build
