name: Diagnostics V2 Automated Tests

on:
  push:
    paths:
      - "services/fleet-core-service-legacy/internal/domains/diagnostics_v2/**"
  pull_request:
    paths:
      - "services/fleet-core-service-legacy/internal/domains/diagnostics_v2/**"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Start Docker (required for testcontainers)
        run: sudo systemctl start docker

      - name: Run Diagnostics Tests
        run: |
          cd services/fleet-core-service-legacy
          go test ./internal/domains/diagnostics_v2/... -v -timeout 10m
