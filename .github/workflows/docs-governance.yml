name: Docs Governance

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'scripts/check_docs_governance.py'
      - '.github/workflows/docs-governance.yml'
      - 'docs/api/openapi.yaml'
  push:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'scripts/check_docs_governance.py'
      - '.github/workflows/docs-governance.yml'
      - 'docs/api/openapi.yaml'

jobs:
  docs-governance:
    name: Validate Documentation Spec Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run docs governance checks
        run: python3 scripts/check_docs_governance.py

      - name: Validate canonical OpenAPI spec
        run: go run github.com/getkin/kin-openapi/cmd/validate-spec@latest docs/api/openapi.yaml
