name: Design System Foundation

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "packages/common/design/**"
      - "apps/mobile/shared/design/**"
      - "apps/dashboard-web/src/styles/design-tokens.css"
      - "apps/dashboard-web/src/index.tsx"
      - "docs/architecture/design-system-contract.md"
      - "scripts/check_design_system_foundation.py"
      - ".github/workflows/design-system-foundation.yml"
  push:
    branches: [main, master, develop]
    paths:
      - "packages/common/design/**"
      - "apps/mobile/shared/design/**"
      - "apps/dashboard-web/src/styles/design-tokens.css"
      - "apps/dashboard-web/src/index.tsx"
      - "docs/architecture/design-system-contract.md"
      - "scripts/check_design_system_foundation.py"
      - ".github/workflows/design-system-foundation.yml"

jobs:
  design-system-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run design system foundation checks
        run: python3 scripts/check_design_system_foundation.py
