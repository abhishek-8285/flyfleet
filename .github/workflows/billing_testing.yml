name: Billing V2 Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Chromedp Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Unit Tests
        run: go test -v ./internal/domains/billing/pdf/...

      - name: Run Integration Tests
        run: go test -v ./internal/domains/billing/queue/...

      - name: Verify Snapshot Integrity
        run: go test -v -run TestPDFSnapshot_Deterministic ./internal/domains/billing/pdf/...

      - name: Run Storage & MinIO Integration Tests
        run: go test -v ./internal/domains/billing/storage/...

      - name: Run Load & Concurrency Tests
        run: go test -v ./internal/domains/billing/load/...

      - name: Collect and Verify Coverage
        run: |
          echo "📊 Collecting coverage across all billing packages..."
          go test ./internal/domains/billing/... -coverprofile=coverage.out -covermode=atomic
          bash scripts/check_coverage.sh 70
