name: Service Integration Matrix

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * *'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'services/**'
      - 'scripts/runtime_integration_gate.sh'
      - '.github/workflows/service-integration-matrix.yml'
      - 'docker-compose.yml'
  push:
    branches: [master, main, develop]
    paths:
      - 'services/**'
      - 'scripts/runtime_integration_gate.sh'
      - '.github/workflows/service-integration-matrix.yml'
      - 'docker-compose.yml'

jobs:
  service-integration-matrix:
    name: Full Stack Service Integration Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run runtime gate with service matrix checks
        env:
          JWT_SECRET: ci-runtime-secret
        run: bash scripts/runtime_integration_gate.sh
