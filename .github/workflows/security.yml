name: Security & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24"
  TRIVY_VERSION: "0.50.0"

jobs:
  # ── Custom Security Scanning (Semgrep) ─────────────
  semgrep:
    name: Semgrep Custom Rule Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yaml
          generateSarif: "1"

  # ── Static Analysis (SAST) ──────────────────────────
  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/microservices/auth-service
          - services/microservices/fleet-core-service-new
          - services/microservices/tracking-service
          - services/microservices/web-bff
          - packages/common/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go Vet
        run: |
          cd ${{ matrix.service }}
          go vet ./...

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: ${{ matrix.service }}

      - name: Run Gosec (Security Scanner)
        uses: securego/gosec@master
        with:
          args: "-severity medium -quiet ./..."
          working-directory: ${{ matrix.service }}

  # ── Filesystem Vulnerability Scanning (Trivy) ────────
  trivy:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - fleet-core-service-new
          - tracking-service
          - web-bff
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (FS Mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "services/microservices/${{ matrix.service }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"

  # ── Tenant Isolation Leak Test ──────────────────────
  tenant-isolation:
    name: Tenant Isolation Verification
    runs-on: ubuntu-latest
    needs: [sast]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build services
        run: |
          cd services/microservices/fleet-core-service-new && go build -o /dev/null ./cmd/...
          cd ../tracking-service && go build -o /dev/null ./cmd/...
          cd ../web-bff && go build -o /dev/null ./cmd/...
      - name: Run org-id-enforcer
        run: |
          cd services/fleet-core-service-legacy
          go run cmd/org-id-enforcer/main.go ./...

  # ── Dependency Audit ────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/microservices/auth-service
          - services/microservices/fleet-core-service-new
          - services/microservices/tracking-service
          - services/microservices/web-bff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd ${{ matrix.service }}
          govulncheck ./...
