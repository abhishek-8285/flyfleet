name: Enterprise Foundation Gates

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'apps/dashboard-web/src/**'
      - 'apps/mobile/shared/**'
      - 'services/microservices/web-bff/**'
      - '.github/workflows/*.yml'
      - 'Makefile'
      - 'package.json'
  push:
    branches: [master, main, develop]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'apps/dashboard-web/src/**'
      - 'apps/mobile/shared/**'
      - 'services/microservices/web-bff/**'
      - '.github/workflows/*.yml'
      - 'Makefile'
      - 'package.json'

jobs:
  enterprise-foundation:
    name: Run Enterprise Foundation Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run all foundation checks
        run: python3 scripts/check_enterprise_foundation.py
