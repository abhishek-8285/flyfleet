global:
  domain: flyfleet.local
  environment: "production"
  imageTag: ""  # Override via --set global.imageTag=xxx during deployment
  jwtSecret: "REPLACE-WITH-SECURE-JWT-SECRET"  # Should be overridden by K8s secret
  postgres:
    host: "postgres.flyfleet.svc.cluster.local"
    port: "5432"
    user: "fleet_user"
    password: "REPLACE-WITH-SECURE-DB-PASSWORD"  # Override with secret
    db: "flyfleet"
  redis:
    host: "redis.flyfleet.svc.cluster.local"
    port: "6379"
  nats:
    url: "nats://fleet-nats.flyfleet.svc.cluster.local:4222"

# Service Account configuration
serviceAccount:
  create: true
  name: ""  # Auto-generated by default

# IAM annotations for IRSA
iam:
  annotations:
    eks.amazonaws.com/role-arn: ""

# Database secret reference
database:
  secretName: "flyfleet-secrets"

# Default resource configuration
defaultResources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Default autoscaling
defaultAutoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80
  behavior: {}

# Health check defaults
defaultProbes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Ingress configuration (for API and Web BFF)
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "10"
    nginx.ingress.kubernetes.io/rate-limit-burst: "20"
  hosts:
    - host: api.flyfleet.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: fleet-core-service
            port: 8084
    - host: dashboard.flyfleet.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: web-bff
            port: 8081
  tls: []

#=====================
# Service Definitions
#=====================

# Authentication Service
auth-service:
  enabled: false
  replicas: 2
  image:
    repository: "flyfleet/auth-service"
    tag: "v1.0.0"
    pullPolicy: "Always"
  service:
    port: 8080
    type: ClusterIP
  resources: {}
  autoscaling: {}
  env:
    PORT: "8080"
    JWT_SECRET: ""

# Fleet Core Service (modular monolith handling most domains)
fleet-core-service:
  enabled: true
  replicas: 3
  image:
    repository: "flyfleet/fleet-core-service"
    tag: "v1.0.0"
    pullPolicy: "Always"
  service:
    port: 8084
    type: ClusterIP
  resources: {}
  autoscaling: {}
  env:
    PORT: "8084"
    LOG_LEVEL: "info"
    DATABASE_URL: "postgres://{{ .Values.global.postgres.user }}:{{ .Values.global.postgres.password }}@{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/{{ .Values.global.postgres.db }}?sslmode=disable"
    REDIS_URL: "{{ .Values.global.redis.host }}:{{ .Values.global.redis.port }}"
    NATS_URL: "{{ .Values.global.nats.url }}"
    JWT_SECRET: "{{ .Values.global.jwtSecret }}"

# Alert Service
alert-service:
  enabled: false
  replicas: 2
  image:
    repository: "flyfleet/alert-service"
    tag: "v1.0.0"
    pullPolicy: "Always"
  service:
    port: 8080
    type: ClusterIP
  resources: {}
  autoscaling: {}
  env:
    PORT: "8080"

