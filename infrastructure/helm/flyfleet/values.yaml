global:
  domain: flyfleet.local
  jwtSecret: "your-jwt-secret-key-here"
  postgres:
    host: "postgres"
    port: "5432"
    user: "fleet_user"
    password: "fleet_password"
    db: "fleet_db"
  redis:
    host: "redis"
    port: "6379"
  nats:
    url: "nats://nats:4222"

auth-service:
  enabled: true
  image:
    repository: "flyfleet/auth-service"
    tag: "latest"
  service:
    port: 8080
  env:
    PORT: "8080"
    JWT_SECRET: "{{ .Values.global.jwtSecret }}"
