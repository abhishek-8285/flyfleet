apiVersion: apps/v1
kind: Deployment
metadata:
    name: fleet-redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fleet-redis
    template:
        metadata:
            labels:
                app: fleet-redis
        spec:
            containers:
                - name: redis
                  image: redis:7-alpine
                  ports:
                      - containerPort: 6379
                        name: redis
---
apiVersion: v1
kind: Service
metadata:
    name: redis
spec:
    ports:
        - port: 6379
          targetPort: 6379
    selector:
        app: fleet-redis
