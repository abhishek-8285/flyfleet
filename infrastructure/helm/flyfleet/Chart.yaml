apiVersion: v2
name: flyfleet
description: A Helm chart for deploying the entire FlyFleet stack
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: auth-service.enabled
    alias: auth-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: fleet-core-service.enabled
    alias: fleet-core-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: alert-service.enabled
    alias: alert-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: admin-support-service.enabled
    alias: admin-support-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: billing-service.enabled
    alias: billing-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: tracking-service.enabled
    alias: tracking-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: web-bff.enabled
    alias: web-bff
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: reports-service.enabled
    alias: reports-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: governance-service.enabled
    alias: governance-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: analytics-service.enabled
    alias: analytics-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: integrations-service.enabled
    alias: integrations-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: settings-service.enabled
    alias: settings-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: maintenance-service.enabled
    alias: maintenance-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: vehicle-service.enabled
    alias: vehicle-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: driver-service.enabled
    alias: driver-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: trip-service.enabled
    alias: trip-service
  - name: flyfleet-service
    version: 0.1.0
    repository: "file://../flyfleet-service"
    condition: fleet-ml-service.enabled
    alias: fleet-ml-service
