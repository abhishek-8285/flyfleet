# Grafana datasource configuration for FlyFleet
# This ConfigMap provides datasources for Grafana

apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-operated.monitoring.svc.cluster.local:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
      sigV4Auth: false
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
    version: 1

  # Loki for logs (if deployed)
