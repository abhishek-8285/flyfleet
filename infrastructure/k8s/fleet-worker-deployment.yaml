apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-core-workers
  namespace: flyfleet
  labels:
    app: fleet-core-service
    tier: workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-core-service
      tier: workers
  template:
    metadata:
      labels:
        app: fleet-core-service
        tier: workers
    spec:
      containers:
        - name: fleet-core-service
          image: flyfleet/fleet-core-service:latest
          env:
            - name: EXECUTION_MODE
              value: "WORKERS"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flyfleet-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: flyfleet-secrets
                  key: redis-url
            - name: NATS_URL
              value: "nats://nats:4222"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
