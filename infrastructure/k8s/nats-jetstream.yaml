apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: flyfleet
data:
  nats.conf: |
    jetstream {
      store_dir: "/data/jetstream"
      max_mem: 2G
      max_file: 50G
    }
    cluster {
      port: 6222
      routes [
        nats://nats-0.nats-headless.flyfleet.svc.cluster.local:6222
        nats://nats-1.nats-headless.flyfleet.svc.cluster.local:6222
        nats://nats-2.nats-headless.flyfleet.svc.cluster.local:6222
      ]
    }
    # Production Streams Configuration
    # Note: Streams are typically created via nats-cli or service init
    # But we define the capability and replication factors here.
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: flyfleet
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
  - name: cluster
    port: 6222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: flyfleet
spec:
  serviceName: nats-headless
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: ["-c", "/etc/nats/nats.conf"]
        ports:
        - name: client
          containerPort: 4222
        - name: cluster
          containerPort: 6222
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
        - name: nats-data
          mountPath: /data
      volumes:
      - name: nats-config
        configMap:
          name: nats-config
  volumeClaimTemplates:
  - metadata:
      name: nats-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3
      resources:
        requests:
          storage: 50Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats-pdb
  namespace: flyfleet
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nats
