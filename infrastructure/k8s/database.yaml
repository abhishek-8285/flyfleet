# flyfleet-postgres-service points to the AWS RDS instance defined in Terraform
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: flyfleet
spec:
  type: ExternalName
  externalName: flyfleet-postgres.xxxx.rds.amazonaws.com # User should update with actual RDS endpoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyfleet-timescaledb
  namespace: flyfleet
spec:
  replicas: 1 # Scale to 2+ if using TimescaleDB multi-node or enterprise
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "telemetry"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: flyfleet-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flyfleet-db-secret
              key: password
        volumeMounts:
        - name: timescaledb-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "4Gi" # Optimized for heavy write load
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: timescaledb-storage
        persistentVolumeClaim:
          claimName: timescaledb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
  namespace: flyfleet
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 200Gi # Increased for telemetry scale
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb-service
  namespace: flyfleet
spec:
  selector:
    app: timescaledb
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: timescaledb-pdb
  namespace: flyfleet
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: timescaledb