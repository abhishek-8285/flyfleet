apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flyfleet
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: flyfleet/auth-service:latest # Example image tag
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: flyfleet-config
            - secretRef:
                name: flyfleet-secrets
          env:
            - name: DB_HOST
              value: postgres-service.flyfleet.svc.cluster.local
            - name: DB_PORT
              value: "5432"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flyfleet
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
---
apiVersion: policy/v1
metadata:
  name: auth-service-pdb
  namespace: flyfleet
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
