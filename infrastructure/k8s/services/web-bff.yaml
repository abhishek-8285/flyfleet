apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: flyfleet
  labels:
    app: web-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-bff
  template:
    metadata:
      labels:
        app: web-bff
    spec:
      containers:
        - name: web-bff
          image: flyfleet/web-bff:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: flyfleet-config
            - secretRef:
                name: flyfleet-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-bff-service
  namespace: flyfleet
spec:
  selector:
    app: web-bff
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
