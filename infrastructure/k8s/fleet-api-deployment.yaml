apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-core-api
  namespace: flyfleet
  labels:
    app: fleet-core-service
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fleet-core-service
      tier: api
  template:
    metadata:
      labels:
        app: fleet-core-service
        tier: api
    spec:
      containers:
        - name: fleet-core-service
          image: flyfleet/fleet-core-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: EXECUTION_MODE
              value: "API"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flyfleet-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: flyfleet-secrets
                  key: redis-url
            - name: NATS_URL
              value: "nats://nats:4222"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-core-api
  namespace: flyfleet
spec:
  selector:
    app: fleet-core-service
    tier: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
