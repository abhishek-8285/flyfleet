---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flyfleet-secrets
  namespace: flyfleet
  labels:
    app: flyfleet
    component: secrets
spec:
  # Refresh interval (how often to sync with AWS Secrets Manager)
  refreshInterval: "1h"  # Adjust based on your rotation needs

  # Secret Store to use (must match ClusterSecretStore name)
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  # Target Kubernetes Secret to create/update
  target:
    name: flyfleet-secrets
    creationPolicy: Owner  # ES creates and owns this secret
    deletionPolicy: Delete  # Delete secret when ExternalSecret is deleted
    template:
      # Optional: add custom labels/annotations to the secret
      metadata:
        labels:
          app: flyfleet
      # Optional: transform the data before creating
      data:
        # Example transformation: convert db_url to DATABASE_URL env var format
        # This will create a key named "DATABASE_URL" in the K8s secret
        - key: "db_url"
          path: "flyfleet/production/database"
          property: "url"
          # transformation:
          #   type: Base64Decode

  # Data to fetch from AWS Secrets Manager
  data:
    # Database credentials
    - secretKey: "DATABASE_URL"  # Key name in K8s secret
      remoteRef:
        key: "flyfleet/production/database"  # AWS Secrets Manager secret name
        property: "url"  # Optional: specific JSON key in the secret

    - secretKey: "DB_PASSWORD"
      remoteRef:
        key: "flyfleet/production/database"
        property: "password"

    # Redis credentials
    - secretKey: "REDIS_URL"
      remoteRef:
        key: "flyfleet/production/redis"
        property: "url"

    # NATS credentials
    - secretKey: "NATS_URL"
      remoteRef:
        key: "flyfleet/production/nats"
        property: "url"

    # JWT Secret (critical for authentication)
    - secretKey: "JWT_SECRET"
      remoteRef:
        key: "flyfleet/production/auth"
        property: "jwt_secret"

    # Optional: API keys for external services
    - secretKey: "SENDGRID_API_KEY"
      remoteRef:
        key: "flyfleet/production/sendgrid"
        property: "api_key"

    - secretKey: "TWILIO_AUTH_TOKEN"
      remoteRef:
        key: "flyfleet/production/twilio"
        property: "auth_token"

    # Optional: TLS certificates
    # - secretKey: "TLS_CERT"
    #   remoteRef:
    #     key: "flyfleet/production/tls"
    #     property: "cert"

---
# PushSecret (optional): Push data from K8s secret back to AWS Secrets Manager
# Useful for secret rotation workflows
apiVersion: external-secrets.io/v1beta1
kind: PushSecret
metadata:
  name: push-rotated-secrets
  namespace: flyfleet
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  data:
    - match:
        secretKey: "DB_PASSWORD"
        remoteRef:
          key: "flyfleet/production/database"
          property: "password"
      updateRemote: true
      deletionPolicy: " Retain"  # Don't delete secrets from AWS when empty

---
# Example: Secret for a specific service (e.g., billing-service)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-service-secrets
  namespace: flyfleet
  labels:
    app: billing-service
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: billing-service-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: billing-service
  data:
    - secretKey: "STRIPE_API_KEY"
      remoteRef:
        key: "flyfleet/production/billing/stripe"
        property: "api_key"
    - secretKey: "STRIPE_WEBHOOK_SECRET"
      remoteRef:
        key: "flyfleet/production/billing/stripe"
        property: "webhook_secret"
    - secretKey: "FINANCE_DB_PASSWORD"
      remoteRef:
        key: "flyfleet/production/finance-db"
        property: "password"

---
# Example: Generate secret from template (e.g., random password)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: generic-store
  namespace: flyfleet
spec:
  provider:
    generic:
      # Create secrets locally in Kubernetes (not from AWS)
      # Useful for generated secrets
      createSecret: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: generated-secrets
  namespace: flyfleet
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: generic-store
    kind: SecretStore
  target:
    name: generated-secrets
    creationPolicy: Owner
  dataFrom:
    - source:
        # Generate random data
        generate:
          type: randomBytes
          length: 32
      target: "GENERATED_SECRET"
