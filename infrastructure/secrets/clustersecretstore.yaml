---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    environment: production
spec:
  provider:
    aws:
      service: SecretsManager
      # AWS region
      region: us-east-1

      # Authentication method: IAM Role (recommended for EKS with IRSA)
      # The service account must have IAM permissions to access Secrets Manager
      auth:
        # IRSA - IAM Role for Service Accounts (recommended)
        iam:
          role: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/flyfleet-external-secrets-${ENVIRONMENT}"

        # Alternative: Access key (not recommended for production)
        # accessKeyRef:
        #   accessKeyID:
        #     name: aws-secret
        #     key: access-key-id
        #   secretAccessKey:
        #     name: aws-secret
        #     key: secret-access-key

      # Optional: VPC endpoint for Secrets Manager (private connectivity)
      # endpoint: "https://secretsmanager.us-east-1.amazonaws.com"

---
# Example: Namespace-scoped SecretStore (optional, use ClusterSecretStore for cluster-wide)
