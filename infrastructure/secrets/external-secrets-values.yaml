# External Secrets Operator Helm values for FlyFleet
# https://github.com/external-secrets/external-secrets

# ============================================================================
# External Secrets Operator
# ============================================================================
installCRDs: true  # Automatically install Custom Resource Definitions

# Replica count for high availability
replicaCount: 2

# Image configuration
image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v0.10.2
  pullPolicy: IfNotPresent

# Resource limits
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Security context
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
      - ALL

# Service account (AWS IAM integration via IAM Pod Identity or IRSA)
serviceAccount:
  create: true
  name: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/flyfleet-external-secrets-${ENVIRONMENT}"

# RBAC
rbac:
  create: true
  pspEnabled: false  # Use Pod Security Standards instead

# Webhook configuration (validates ExternalSecret resources)
webhook:
  insecure: false
  port: 443
  failurePolicy: Fail

# Leader election (HA)
leaderElection:
  enabled: true

# ============================================================================
# AWS Provider Configuration
# ============================================================================
# The provider is configured via SecretStore/ClusterSecretStore resources
# See below for ClusterSecretStore definition

# ============================================================================
# Metrics & Monitoring
# ============================================================================
metrics:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 60s
  prometheusRules:
    enabled: true
    namespace: monitoring
    rules:
      - alert: ExternalSecretsOperatorDown
        expr: up{job="external-secrets"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "External Secrets Operator is down"
          description: "The external-secrets operator is not responding"

# ============================================================================
# Pod Disruption Budget
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# Node Selector & Toleration (for EKS managed node groups)
# ============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# Logging
# ============================================================================
logLevel: 1  # 1=debug, 2=info, 3=warning, 4=error
logFormat: json
