# FlyFleet Log Rotation Configuration
# Install: sudo cp flyfleet-logrotate.conf /etc/logrotate.d/flyfleet
# Test: sudo logrotate -d /etc/logrotate.d/flyfleet

# Application logs in flyfleet/tmp/logs/
/data/data/com.termux/files/home/flyfleet/tmp/logs/*.log {
    daily                 # Rotate daily
    missingok            # Ignore if file is missing
    rotate 7             # Keep 7 days of logs
    compress             # Compress rotated logs with gzip
    delaycompress        # Compress on next rotation (keeps current readable)
    notifempty           # Don't rotate empty logs
    create 0640 u0_a412 u0_a412  # Create new log with these permissions
    sharedscripts        # Run postrotate script once for all logs
    postrotate
        # Send SIGUSR1 to running processes to reopen log files
        # (Only works if processes handle this signal - most Go programs don't need it)
        # For FlyFleet with stdout logging, Docker restart needed
        # This is informational - actual log rotation works without signal
        true
    endscript
}

# PostgreSQL container logs (if using docker-compose)
/data/data/com.termux/files/home/flyfleet/postgres.log {
    weekly
    missingok
    rotate 4
    compress
    delaycompress
    notifempty
    create 0640 u0_a412 u0_a412
    sharedscripts
    postrotate
        docker kill --signal=HUP fleet-postgres 2>/dev/null || true
    endscript
}

