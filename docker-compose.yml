version: "3.8"

networks:
  fleet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:

services:
  # Database Services
  postgres:
    image: timescale/timescaledb-ha:pg15
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements,timescaledb",
      ]
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: ${POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - fleet-network
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8222/varz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monolithic Fleet Core Service (Consolidated Backend)
  fleet-core-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: fleet-core-service-legacy
    container_name: fleet-monolith
    volumes:
      - ./config.toml:/app/config.toml
      - ./backups:/backups
    ports:
      - "8081:8084" # Mapping 8081 (BFF port) to 8084 (Monolith internal port)
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-fleet_user}:${POSTGRES_PASSWORD:-fleet_password}@fleet-postgres:5432/${POSTGRES_DB:-fleet_db}?sslmode=disable
      - NATS_URL=nats://fleet-nats:4222
      - REDIS_URL=fleet-redis:6379
      - REDIS_ADDR=fleet-redis:6379
      - JWT_SECRET=${JWT_SECRET:-runtime-integration-secret}
      - DISABLE_AUTH_RATE_LIMIT=true
      - PORT=8084
      - LOG_LEVEL=info
      - ENFORCE_BFF_AUTH_GATE=true
      # Unified internal service URLs (Internal loopback via Monolith's internal gateway)
      - AUTH_SERVICE_URL=http://localhost:8084
      - ALERT_SERVICE_URL=http://localhost:8084
      - ADMIN_SUPPORT_SERVICE_URL=http://localhost:8084
      - BILLING_SERVICE_URL=http://localhost:8084
      - TRACKING_SERVICE_URL=http://localhost:8084
      - VEHICLE_SERVICE_URL=http://localhost:8084
      - TRIP_SERVICE_URL=http://localhost:8084
      - MAINTENANCE_SERVICE_URL=http://localhost:8084
      - GOVERNANCE_SERVICE_URL=http://localhost:8084
      - SETTINGS_SERVICE_URL=http://localhost:8084
      - ANALYTICS_SERVICE_URL=http://localhost:8084
      - INTEGRATIONS_SERVICE_URL=http://localhost:8084
      - REPORTS_SERVICE_URL=http://localhost:8084
      - ML_SERVICE_URL=http://fleet-ml-service:8000
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  fleet-ml-service:
    build:
      context: services/microservices/fleet-ml-service
      dockerfile: Dockerfile
    container_name: fleet-ml-service
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-fleet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fleet_password}
      - POSTGRES_DB=${POSTGRES_DB:-fleet_db}
      - JWT_SECRET=${JWT_SECRET:-runtime-integration-secret}
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Disaster Recovery & Maintenance
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: fleet-db-backup
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=${POSTGRES_USER:-fleet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fleet_password}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
