version: '3.8'

networks:
  fleet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:


services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleet_user -d fleet_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - fleet-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - fleet-network
    command: [ "--jetstream", "--store_dir", "/data", "-m", "8222" ]
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Services
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: fleet-auth-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - JWT_SECRET=your-jwt-secret-key-here
      - PORT=8080
      - FLEET_CORE_SERVICE_URL=http://fleet-core-service:8084
      - ALERT_SERVICE_URL=http://alert-service:8085
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy

  fleet-core-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: fleet-core-service
    container_name: fleet-core-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - PORT=8084
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  alert-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: alert-service
    container_name: fleet-alert-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - PORT=8085
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  admin-support-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: admin-support-service
    container_name: fleet-admin-support-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - PORT=8086
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: billing-service
    container_name: fleet-billing-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - PORT=8087
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy

  tracking-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: tracking-service
    container_name: fleet-tracking-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - PORT=8082
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  web-bff:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: web-bff
    container_name: fleet-web-bff
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - AUTH_SERVICE_URL=http://auth-service:8080
      - FLEET_CORE_SERVICE_URL=http://fleet-core-service:8084
      - ALERT_SERVICE_URL=http://alert-service:8085
      - ADMIN_SUPPORT_SERVICE_URL=http://admin-support-service:8086
      - BILLING_SERVICE_URL=http://billing-service:8087
      - TRACKING_SERVICE_URL=http://tracking-service:8082
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      - auth-service
      - fleet-core-service
      - alert-service
      - admin-support-service
      - billing-service
      - tracking-service
      - reports-service

  reports-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: reports-service
    container_name: fleet-reports-service
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - NOTIFICATION_SERVICE_URL=http://alert-service:8085
      - PORT=8083
      - JWT_SECRET=your-jwt-secret-key-here
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Disaster Recovery & Maintenance
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: fleet-db-backup
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=fleet_user
      - POSTGRES_PASSWORD=fleet_password
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
