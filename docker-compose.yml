version: '3.8'

networks:
  fleet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:


services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleet_user -d fleet_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - fleet-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - fleet-network
    command: [ "--jetstream", "--store_dir", "/data", "-m", "8222" ]
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Services
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: fleet-auth-service
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - JWT_SECRET=your-jwt-secret-key-here
      - PORT=8080
      - DRIVER_SERVICE_URL=http://driver-service:8080/api/v1
      - VEHICLE_SERVICE_URL=http://vehicle-service:8080/api/v1
      - TRIP_SERVICE_URL=http://trip-service:8080/api/v1
      - ALERT_SERVICE_URL=http://alert-service:8080/api/v1
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy

  vehicle-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: vehicle-service
    container_name: fleet-vehicle-service
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - PORT=8080
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  driver-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: driver-service
    container_name: fleet-driver-service
    ports:
      - "8083:8080"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - PORT=8080
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy

  trip-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: trip-service
    container_name: fleet-trip-service
    ports:
      - "8084:8080"
    environment:
      - DATABASE_URL=postgres://fleet_user:fleet_password@postgres:5432/fleet_db?sslmode=disable
      - PORT=8080
      - NATS_URL=nats://nats:4222
    networks:
