syntax = "proto3";

package tracking.v1;

option go_package = "github.com/flyfleet/proto/tracking/v1;trackingv1";

import "google/protobuf/timestamp.proto";

service TrackingService {
  rpc TrackLocation (TrackLocationRequest) returns (TrackLocationResponse);
  rpc GetLatestLocation (GetLatestLocationRequest) returns (GetLatestLocationResponse);
  rpc IngestTelemetryBatch (IngestTelemetryBatchRequest) returns (IngestTelemetryBatchResponse);
}

message Telemetry {
  string vehicle_id = 1;
  string tenant_id = 2;
  double latitude = 3;
  double longitude = 4;
  double speed = 5;
  double heading = 6;
  double accuracy = 7;
  double altitude = 8;
  bool ignition = 9;
  double odometer = 10;
  google.protobuf.Timestamp timestamp = 11;
  map<string, string> metadata = 12;
}

message GPSTelemetry {
  google.protobuf.Timestamp time = 1;
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;
  double speed = 5;
  double heading = 6;
  double accuracy = 7;
  bool ignition = 8;
  double odometer = 9;
  int32 battery_level = 10;
  int32 satellites = 11;
}

message OBDTelemetry {
  google.protobuf.Timestamp time = 1;
  int32 rpm = 2;
  double coolant_temp = 3;
  double engine_load = 4;
  double throttle_pos = 5;
  double fuel_level = 6;
  repeated string dtcs = 7;
  string vin = 8;
}

message FuelTelemetry {
  google.protobuf.Timestamp time = 1;
  double level_percent = 2;
  double level_liters = 3;
  bool refuel_event = 4;
  bool theft_event = 5;
}

message Heartbeat {
  string device_id = 1;
  string status = 2;
  google.protobuf.Timestamp last_seen = 3;
  int32 battery_level = 4;
  int32 signal_strength = 5;
}

message TelemetryBatch {
  string device_id = 1;
  string vehicle_id = 2;
  string tenant_id = 3;
  repeated GPSTelemetry gps_data = 4;
  repeated OBDTelemetry obd_data = 5;
  repeated FuelTelemetry fuel_data = 6;
  Heartbeat heartbeat = 7;
}

message TrackLocationRequest {
  Telemetry telemetry = 1;
}

message TrackLocationResponse {
  bool success = 1;
}

message GetLatestLocationRequest {
  string vehicle_id = 1;
}

message GetLatestLocationResponse {
  Telemetry telemetry = 1;
}

message IngestTelemetryBatchRequest {
  TelemetryBatch batch = 1;
}

message IngestTelemetryBatchResponse {
  bool success = 1;
  string message = 2;
}
