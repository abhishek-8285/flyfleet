syntax = "proto3";

package maintenance.v1;

option go_package = "github.com/flyfleet/proto/maintenance/v1;maintenancev1";

import "google/protobuf/timestamp.proto";

service MaintenanceService {
  // Work Orders
  rpc ListWorkOrders (ListWorkOrdersRequest) returns (ListWorkOrdersResponse);
  rpc GetWorkOrder (GetWorkOrderRequest) returns (GetWorkOrderResponse);
  rpc CreateWorkOrder (CreateWorkOrderRequest) returns (CreateWorkOrderResponse);
  rpc GetWorkOrderStats (GetWorkOrderStatsRequest) returns (GetWorkOrderStatsResponse);

  // Maintenance
  rpc GetMaintenanceSummary (GetMaintenanceSummaryRequest) returns (GetMaintenanceSummaryResponse);
  rpc ListSchedules (ListSchedulesRequest) returns (ListSchedulesResponse);

  // Inventory
  rpc ListInventory (ListInventoryRequest) returns (ListInventoryResponse);
}

message WorkOrder {
  string id = 1;
  string org_id = 2;
  string vehicle_id = 3;
  string title = 4;
  string status = 5;
  string priority = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
}

message ListWorkOrdersRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListWorkOrdersResponse {
  repeated WorkOrder work_orders = 1;
  int32 total = 2;
}

message GetWorkOrderRequest {
  string id = 1;
}

message GetWorkOrderResponse {
  WorkOrder work_order = 1;
}

message CreateWorkOrderRequest {
  string vehicle_id = 1;
  string title = 2;
  string description = 3;
  string priority = 4;
}

message CreateWorkOrderResponse {
  WorkOrder work_order = 1;
}

message GetWorkOrderStatsRequest {
  string org_id = 1;
}

message GetWorkOrderStatsResponse {
  int32 open_orders = 1;
  int32 pending_orders = 2;
  int32 completed_mtd = 3;
}

message GetMaintenanceSummaryRequest {
  string org_id = 1;
}

message GetMaintenanceSummaryResponse {
  int32 upcoming_services = 1;
  int32 overdue_services = 2;
  double total_cost_mtd = 3;
}

message ListSchedulesRequest {
  string org_id = 1;
}

message ListSchedulesResponse {
  // Simplified for now
  int32 count = 1;
}

message ListInventoryRequest {
  string org_id = 1;
}

message ListInventoryResponse {
  int32 total_parts = 1;
  int32 low_stock_alerts = 2;
}
