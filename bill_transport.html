<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<style>
		body { font-family: sans-serif; font-size: 9pt; padding: 20px; }
		.header { display: flex; justify-content: space-between; background: #3b82f6; color: white; padding: 20px; }
		.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
		table { width: 100%; border-collapse: collapse; }
		th { background: #f1f5f9; padding: 8px; text-align: left; }
		td { padding: 8px; border-bottom: 1px solid #e2e8f0; }
		.total-box { text-align: right; margin-top: 20px; font-weight: bold; font-size: 12pt; }
	</style>
</head>
<body>
	<div class="header">
		<div>
			<h1></h1>
			<p></p>
		</div>
		<div style="text-align: right">
			<h2>INVOICE</h2>
			<p>#TRP-001</p>
		</div>
	</div>
	<div class="grid">
		<div>
			<strong>BILL TO:</strong>
			<p>Amazon India<br></p>
		</div>
		<div style="text-align: right">
			<p>Date: </p>
			<p>Due: </p>
		</div>
	</div>
	<table>
		<thead>
			<tr>
				<th>Description</th>
				<th>Qty</th>
				<th>Price</th>
				<th>Total</th>
			</tr>
		</thead>
		<tbody>
			
		</tbody>
	</table>
	<div class="total-box">
		Total: ₹45000
	</div>
</body>
</html>
