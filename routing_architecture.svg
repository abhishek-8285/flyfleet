<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#0F172A"/>
  
  <!-- Header -->
  <text x="40" y="45" fill="white" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">FlyFleet: Self-Hosted Routing Architecture</text>
  <text x="40" y="70" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">No Third-Party APIs • Native Trucking Logic • Valhalla + OSM</text>

  <!-- External/Client Side -->
  <rect x="40" y="120" width="180" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="55" y="150" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Frontend</text>
  <text x="55" y="170" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">Next.js • Leaflet</text>
  
  <rect x="55" y="200" width="150" height="60" rx="8" fill="#0F172A" stroke="#137fec" stroke-opacity="0.5"/>
  <text x="70" y="225" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Map UI</text>
  <text x="70" y="242" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Location Picker</text>

  <rect x="55" y="280" width="150" height="60" rx="8" fill="#0F172A" stroke="#137fec" stroke-opacity="0.5"/>
  <text x="70" y="305" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Rendering</text>
  <text x="70" y="322" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">SVG Polyline Path</text>

  <!-- Arrows: Client to Backend -->
  <path d="M220 280 L300 280" stroke="#137fec" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="270" fill="#137fec" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">GET /routing/path</text>

  <!-- Middleware / Backend -->
  <rect x="310" y="120" width="180" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="325" y="150" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Backend Core</text>
  <text x="325" y="170" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">Go • FleetCore API</text>

  <rect x="325" y="200" width="150" height="140" rx="8" fill="#0F172A" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="340" y="230" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Routing Service</text>
  
  <rect x="335" y="250" width="130" height="30" rx="4" fill="#1E293B"/>
  <text x="345" y="268" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="10">Proxy Handler</text>
  
  <rect x="335" y="290" width="130" height="30" rx="4" fill="#1E293B"/>
  <text x="345" y="308" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="10">Truck Constraints</text>

  <!-- Arrows: Backend to Engine -->
  <path d="M490 280 L570 280" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="495" y="270" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">JSON RPC</text>

  <!-- Engine Layer -->
  <rect x="580" y="120" width="180" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="595" y="150" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Valhalla Engine</text>
  <text x="595" y="170" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">Self-Hosted Docker</text>

  <rect x="595" y="200" width="150" height="80" rx="8" fill="#0F172A" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="610" y="225" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Routing Algorithm</text>
  <text x="610" y="242" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11">Time-Distance Grid</text>
  <text x="610" y="258" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11">Truck costing</text>

  <rect x="595" y="300" width="150" height="100" rx="8" fill="#0F172A" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="610" y="325" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">OSM Data</text>
  <circle cx="630" cy="360" r="15" fill="#1E293B" stroke="#f59e0b" stroke-width="1"/>
  <text x="655" y="358" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">Processed</text>
  <text x="655" y="370" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">Road Tiles</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="context-stroke" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="40" y="460" width="720" height="25" rx="4" fill="#1E293B" fill-opacity="0.5"/>
  <circle cx="60" cy="472" r="4" fill="#137fec"/>
  <text x="70" y="476" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">User Interaction</text>
  
  <circle cx="180" cy="472" r="4" fill="#10b981"/>
  <text x="190" y="476" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">Internal Proxy</text>
  
  <circle cx="300" cy="472" r="4" fill="#f59e0b"/>
  <text x="310" y="476" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">Offline Map Data</text>
</svg>
