version: "3.8"

networks:
  fleet-network:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:
  opensearch-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  loki-data:
  jaeger-data:
  vault-data:

services:
  # =========================================================================
  # Core Infrastructure (Already Running)
  # =========================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements,timescaledb",
      ]
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: ${POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - fleet-network
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8222/varz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Backend Application
  # =========================================================================
  fleet-core-service:
    build:
      context: .
      dockerfile: infrastructure/docker/GoService.Dockerfile
      args:
        SERVICE_NAME: fleet-core-service-legacy
    container_name: fleet-monolith
    volumes:
      - ./config.toml:/app/config.toml
      - ./backups:/backups
    ports:
      - "8081:8084"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-fleet_user}:${POSTGRES_PASSWORD:-fleet_password}@fleet-postgres:5432/${POSTGRES_DB:-fleet_db}?sslmode=disable
      - NATS_URL=nats://fleet-nats:4222
      - REDIS_URL=fleet-redis:6379
      - REDIS_ADDR=fleet-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - DISABLE_AUTH_RATE_LIMIT=true
      - PORT=8084
      - LOG_LEVEL=info
      - ENFORCE_BFF_AUTH_GATE=true
      - ENABLE_PPROF=${ENABLE_PPROF:-false}
      - PPROF_ADDR=${PPROF_ADDR:-127.0.0.1:6060}
      # OTLP endpoint for tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - fleet-network
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "loki"
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-retries: "5"
        loki-batch-size: "400"

  fleet-ml-service:
    build:
      context: services/microservices/fleet-ml-service
      dockerfile: Dockerfile
    container_name: fleet-ml-service
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-fleet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fleet_password}
      - POSTGRES_DB=${POSTGRES_DB:-fleet_db}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # SEARCH: OpenSearch (100% Free Alternative to Elasticsearch)
  # =========================================================================
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: fleet-opensearch
    environment:
      - cluster.name=flyfleet-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - plugins.security.disabled=true  # Disable security for dev (enable in prod!)
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "http.port=9200"
      - "transport.port=9300"
    ports:
      - "9200:9200"   # REST API
      - "9600:9600"   # Performance Analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g

  # OpenSearch Dashboards (Kibana alternative)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: fleet-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "5601:5601"
    networks:
      - monitoring
    depends_on:
      opensearch:
        condition: service_healthy

  # =========================================================================
  # ANALYTICS: ClickHouse (Columnar DB for BI/Reporting)
  # =========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: fleet-clickhouse
    environment:
      CLICKHOUSE_DB: flyfleet_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-flyfleet}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flyfleet_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring
      - fleet-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 4g

  # =========================================================================
  # OBSERVABILITY: Prometheus + Grafana + Loki + Jaeger
  # =========================================================================

  # OpenTelemetry Collector (collects traces, metrics, logs)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: fleet-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "55681:55681"   # OTLP HTTP receiver
    networks:
      - monitoring
      - fleet-network
    depends_on:
      - jaeger
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: fleet-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: grafana/grafana:latest
    container_name: fleet-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=marcusolsson-csv-datasource,grafana-clickhouse-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
      - jaeger
      - clickhouse
      - opensearch
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  loki:
    image: grafana/loki:latest
    container_name: fleet-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./infrastructure/loki/local-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fleet-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"   # Jaeger UI
      - "6831:6831/udp" # Jaeger thrift
      - "14268:14268"   # Zipkin
      - "14250:14250"   # gRPC
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # SECURITY: Vault (Secrets Management)
  # =========================================================================
  vault:
    image: vault:1.16
    container_name: fleet-vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-dev-root-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./infrastructure/vault/config:/vault/config
    networks:
      - monitoring
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # DISASTER RECOVERY & MAINTENANCE
  # =========================================================================
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: fleet-db-backup
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fleet_db
      - POSTGRES_USER=${POSTGRES_USER:-fleet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fleet_password}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - fleet-network
    depends_on:
      postgres:
        condition: service_healthy
