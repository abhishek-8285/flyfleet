[server]
port = "8084"
log_level = "info"
log_file = ""  # Set path to enable file logging (e.g., "/var/log/flyfleet/app.log")

[database]
url = "postgres://fleet_user:fleet_password@127.0.0.1:5432/fleet_db?sslmode=disable"

[security]
# JWT secret loaded from env var

[nats]
url = "nats://localhost:4222"

[redis]
url = "redis://localhost:6379"

[services]
auth_url = "http://localhost:8084"
alert_url = "http://localhost:8084"
admin_support_url = "http://localhost:8084"
billing_url = "http://localhost:8084"
tracking_url = "http://localhost:8084"
vehicle_url = "http://localhost:8084"
trip_url = "http://localhost:8084"
maintenance_url = "http://localhost:8084"
governance_url = "http://localhost:8084"
settings_url = "http://localhost:8084"
analytics_url = "http://localhost:8084"
integrations_url = "http://localhost:8084"
compliance_url = "http://localhost:8084"
reports_url = "http://localhost:8084"
ml_url = "http://localhost:8000"

[billing]
storage_type = "local"
engine = "premium"
s3_use_ssl = true

[observability]
enable_pprof = false
