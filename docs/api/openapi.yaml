openapi: 3.0.3
info:
  title: FlyFleet API
  description: |
    Enterprise Fleet Management Platform API
    
    ## Key Features
    - Real-time vehicle tracking and monitoring
    - Intelligent trip management and dispatch
    - Predictive maintenance scheduling
    - Driver management and performance tracking
    - Analytics and reporting
    - Payment processing integration
    - Geofencing and alerting
    
    ## Authentication
    All API endpoints require a valid JWT token in the Authorization header:
    `Authorization: Bearer <token>`
    
    ## Rate Limiting
    - 1000 requests per hour for authenticated users
    - 100 requests per hour for anonymous endpoints
  version: 1.0.0
  contact:
    name: FlyFleet API Support
    email: api-support@flyfleet.com
  license:
    name: Proprietary
    url: https://flyfleet.com/terms

servers:
  - url: https://api.flyfleet.com/v1
    description: Production server
  - url: https://staging-api.flyfleet.com/v1
    description: Staging server
  - url: http://localhost:8080/v1
    description: Local development

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticate user and receive JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests

  /vehicles:
    get:
      summary: List vehicles
      description: Retrieve vehicles with optional filtering
      tags: [Vehicles]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/status'
        - name: license_plate
          in: query
          schema:
            type: string
          description: Filter by license plate
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
    
    post:
      summary: Create vehicle
      description: Register a new vehicle in the fleet
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Vehicle created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /vehicles/{id}:
    get:
      summary: Get vehicle details
      description: Retrieve detailed information about a specific vehicle
      tags: [Vehicles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          description: Vehicle not found

  /drivers:
    get:
      summary: List drivers
      description: Retrieve drivers with optional filtering
      tags: [Drivers]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended]
      responses:
        '200':
          description: List of drivers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'

  /trips:
    get:
      summary: List trips
      description: Retrieve trips with filtering and pagination
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, assigned, in_progress, completed, cancelled]
        - name: driver_id
          in: query
          schema:
            type: string
            format: uuid
        - name: vehicle_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
    
    post:
      summary: Create trip
      description: Request a new trip
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

  /maintenance/schedules:
    get:
      summary: List maintenance schedules
      description: Retrieve maintenance schedules with filtering
      tags: [Maintenance]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled]
        - name: vehicle_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of maintenance schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceScheduleListResponse'
    
    post:
      summary: Create maintenance schedule
      description: Schedule vehicle maintenance
      tags: [Maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceScheduleRequest'
      responses:
        '201':
          description: Maintenance schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceSchedule'

  /tracking/vehicles/{id}/location:
    get:
      summary: Get vehicle location
      description: Retrieve current location of a vehicle
      tags: [Tracking]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: timestamp
          in: query
          schema:
            type: string
            format: date-time
          description: Specific timestamp for location history
      responses:
        '200':
          description: Vehicle location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleLocation'

  /analytics/dashboard:
    get:
      summary: Get dashboard analytics
      description: Retrieve key metrics and statistics for dashboard
      tags: [Analytics]
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [today, week, month, quarter, year]
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  /devices/summary:
    get:
      summary: Get device diagnostics summary
      description: Retrieve organization-level diagnostics counters for managed devices.
      tags: [Devices]
      parameters:
        - name: org_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional organization identifier for super-admin contexts.
      responses:
        '200':
          description: Diagnostics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_devices:
                    type: integer
                  online_devices:
                    type: integer
                  offline_devices:
                    type: integer
                  low_battery:
                    type: integer
                  weak_signal:
                    type: integer
                  system_errors:
                    type: integer
                  new_devices_week:
                    type: integer

  /devices/twins:
    get:
      summary: List device twins
      description: Retrieve desired/reported state snapshots for device digital twins.
      tags: [Devices]
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Device twins list
          content:
            application/json:
              schema:
                type: object
                properties:
                  twins:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          format: uuid
                        desired_state:
                          type: object
                          additionalProperties: true
                        reported_state:
                          type: object
                          additionalProperties: true
                        desired_updated_at:
                          type: string
                          format: date-time
                        reported_updated_at:
                          type: string
                          format: date-time

  /firmware/rollouts:
    get:
      summary: List firmware rollouts
      description: Retrieve firmware rollout jobs for the current organization.
      tags: [Devices, Firmware]
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Firmware rollouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollouts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        firmware_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        target_group:
                          type: string
                        status:
                          type: string
                          enum: [scheduled, in_progress, paused, completed, cancelled]
                        total_devices:
                          type: integer
                        completed_devices:
                          type: integer
                        failed_devices:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        started_at:
                          type: string
                          format: date-time
                        completed_at:
                          type: string
                          format: date-time
    post:
      summary: Create firmware rollout
      description: Create a new firmware rollout job for a target device group.
      tags: [Devices, Firmware]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmware_id, name, target_group, total_devices]
              properties:
                firmware_id:
                  type: string
                  format: uuid
                name:
                  type: string
                target_group:
                  type: string
                total_devices:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Rollout created

  /firmware/rollouts/{id}/status:
    patch:
      summary: Transition firmware rollout status
      description: Transition rollout lifecycle state with server-side transition validation.
      tags: [Devices, Firmware]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [scheduled, in_progress, paused, completed, cancelled]
                reason:
                  type: string
                  description: Optional operator reason for this transition, recorded in rollout events.
      responses:
        '200':
          description: Rollout status updated
        '400':
          description: Invalid status transition
        '404':
          description: Rollout not found

  /firmware/rollouts/{id}:
    get:
      summary: Get firmware rollout by ID
      description: Retrieve a single rollout record for the current organization.
      tags: [Devices, Firmware]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rollout details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  firmware_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [scheduled, in_progress, paused, completed, cancelled]
        '404':
          description: Rollout not found

  /firmware/rollouts/{id}/events:
    get:
      summary: List rollout events
      description: Retrieve rollout audit and lifecycle events for a single rollout.
      tags: [Devices, Firmware]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: event_type
          in: query
          description: |
            Optional rollout event filter. Short aliases (`note`, `transition`, `created`)
            are accepted and normalized to canonical values.
          schema:
            type: string
            enum:
              - note
              - transition
              - created
              - rollout.note
              - rollout.transition
              - rollout.created
      responses:
        '200':
          description: Rollout events list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    rollout_id:
                      type: string
                      format: uuid
                    event_type:
                      type: string
                      enum: [rollout.note, rollout.transition, rollout.created]
                    from_status:
                      type: string
                    to_status:
                      type: string
                    message:
                      type: string
                    actor_user_id:
                      type: string
                      format: uuid
                    metadata:
                      type: object
                      additionalProperties: true
                    created_at:
                      type: string
                      format: date-time
        '400':
          description: Invalid request (e.g., invalid event_type)
    post:
      summary: Add rollout note event
      description: Append an operator note to rollout audit history.
      tags: [Devices, Firmware]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Rollout note created
        '400':
          description: Invalid request

  /settings/export:
    get:
      summary: Export settings snapshot
      description: Returns a full snapshot of platform settings for backup/audit workflows.
      tags: [Settings]
      responses:
        '200':
          description: Settings snapshot payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsExport'

  /settings/audit:
    get:
      summary: List settings audit logs
      description: Lists settings audit entries with optional entity/action filters.
      tags: [Settings]
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid query parameters

  /settings/import:
    post:
      summary: Import settings snapshot
      description: Upserts settings payload into current platform configuration.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsImportRequest'
      responses:
        '200':
          description: Import result summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsImportResult'
        '400':
          description: Validation error

  /finance/expenses/reports:
    get:
      summary: List expense reports
      tags: [Finance]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Expense reports list
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseReport'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /finance/expenses/policies:
    get:
      summary: List expense policies
      tags: [Finance]
      responses:
        '200':
          description: Expense policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpensePolicy'
    put:
      summary: Upsert expense policy
      tags: [Finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePolicy'
      responses:
        '200':
          description: Policy saved

  /finance/revenue/forecast:
    get:
      summary: Get revenue forecast by route
      tags: [Finance, Analytics]
      parameters:
        - name: route_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revenue forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast:
                    $ref: '#/components/schemas/RevenueForecast'

  /finance/revenue/experiments:
    get:
      summary: List revenue experiments
      tags: [Finance, Analytics]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Revenue experiments
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: '#/components/schemas/ABTestExperiment'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    
    pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page
    
    status:
      name: status
      in: query
      schema:
        type: string
      description: Filter by status

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, driver, customer]
        org_id:
          type: string
          format: uuid
    
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        license_plate:
          type: string
          example: "KA01AB1234"
        model:
          type: string
          example: "Toyota Innova"
        make:
          type: string
          example: "Toyota"
        year:
          type: integer
          example: 2023
        status:
          type: string
          enum: [active, inactive, maintenance, retired]
        capacity:
          type: integer
          example: 7
        fuel_type:
          type: string
          enum: [petrol, diesel, electric, hybrid]
        current_location:
          $ref: '#/components/schemas/GeoPoint'
    
    CreateVehicleRequest:
      type: object
      required:
        - license_plate
        - model
        - make
        - year
      properties:
        license_plate:
          type: string
        model:
          type: string
        make:
          type: string
        year:
          type: integer
        capacity:
          type: integer
        fuel_type:
          type: string
          enum: [petrol, diesel, electric, hybrid]
    
    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        pagination:
          $ref: '#/components/schemas/Pagination'
    
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        license_number:
          type: string
        rating:
          type: number
          format: float
        status:
          type: string
          enum: [active, inactive, suspended]
        current_location:
          $ref: '#/components/schemas/GeoPoint'
    
    DriverListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        pagination:
          $ref: '#/components/schemas/Pagination'
    
    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, assigned, accepted, in_progress, completed, cancelled]
        pickup_location:
          $ref: '#/components/schemas/GeoPoint'
        dropoff_location:
          $ref: '#/components/schemas/GeoPoint'
        distance:
          type: number
          format: float
        duration:
          type: integer
        price:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
    
    CreateTripRequest:
      type: object
      required:
        - pickup_location
        - dropoff_location
      properties:
        pickup_location:
          $ref: '#/components/schemas/GeoPoint'
        dropoff_location:
          $ref: '#/components/schemas/GeoPoint'
        preferred_time:
          type: string
          format: date-time
        passenger_count:
          type: integer
          minimum: 1
    
    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        pagination:
          $ref: '#/components/schemas/Pagination'
    
    MaintenanceSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [routine, preventive, corrective, emergency]
        name:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        due_odometer:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        estimated_cost:
          type: number
          format: float
    
    CreateMaintenanceScheduleRequest:
      type: object
      required:
        - vehicle_id
        - type
        - name
        - due_date
      properties:
        vehicle_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [routine, preventive, corrective, emergency]
        name:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date-time
        due_odometer:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
    
    MaintenanceScheduleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceSchedule'
        pagination:
          $ref: '#/components/schemas/Pagination'
    
    VehicleLocation:
      type: object
      properties:
        vehicle_id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        speed:
          type: number
          format: float
        heading:
          type: number
          format: float
        timestamp:
          type: string
          format: date-time
    
    DashboardMetrics:
      type: object
      properties:
        total_vehicles:
          type: integer
        active_trips:
